<div class="tab-imuf_flashing toolbar_fixed_bottom">
    <div class="content_wrapper">
        <div class="options gui_box">
            <div class="spacer">
                <table class="cf_table" style="margin-top: 10px;">
                    <tr>
                        <td><select name="imuf_version">
                                <option value="0" i18n="imufFlashingOptionLoading">Loading ...</option>
                        </select></td>
                        <td><span class="description" i18n="imufFlashingOnlineSelectVersionDescription"></span></td>
                    </tr>
                </table>
            </div>
        </div>
        <div class="clear-both"></div>
        <div class="imuf_binary_summary gui_box" style="display: none;">
            <div class="darkgrey_box gui_box_titlebar">
                <div class="spacer_box_title" style="text-align: center;" i18n="imufFlashingBinarySummaryHead"></div>
            </div>
            <div class="spacer" style="margin-bottom: 10px;">
                <strong i18n="imufFlashingBinaryFile"></strong> <span class="file"></span><br />
                <strong i18n="imufFlashingBinarySize"></strong> <span class="size"></span><br />
                <strong i18n="imufFlashingBinaryCipher"></strong> <span class="cipher"></span>
            </div>
        </div>
        <div class="gui_box gui_warning">
            <div class="gui_box_titlebar">
                <div class="spacer_box_title" style="text-align: center;" i18n="warningTitle"></div>
            </div>
            <div class="spacer" style="margin-bottom: 10px;">
                <p i18n="imufFlashingWarningText"></p>
            </div>
        </div>
    </div>
    <div class="content_toolbar">
        <div class="info"><a name="progressbar"></a>
            <progress class="progress" value="0" min="0" max="100"></progress>
            <span class="progressLabel" i18n="imufFlashingSelectFirmware"></span>
        </div>
        <div class="btn">
            <a class="flash_imuf disabled" href="#progressbar" i18n="imufFlashingButtonFlash"></a>
        </div>
        <div class="btn">
            <a class="load_remote_file_imuf disabled" href="#" i18n="imufFlashingButtonLoadOnline"></a>
        </div>
        <div class="btn">
            <a class="load_file_imuf" href="#" i18n="imufFlashingButtonLoadLocal"></a>
        </div>
    </div>
</div>
